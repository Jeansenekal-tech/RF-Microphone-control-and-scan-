<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 400" width="1500" height="400">
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fe6c8"/><stop offset="0.5" stop-color="#3fd8ff"/><stop offset="1" stop-color="#7c6bff"/>
    </linearGradient>
  </defs>
  <svg x="0" y="0" width="400" height="400" viewBox="0 0 1024 1024">
  <defs>
    <!-- macOS icon grid: 824×824 body, 100 px margin, soft drop shadow -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16244f"/>
      <stop offset="0.55" stop-color="#0c1430"/>
      <stop offset="1" stop-color="#1d0d3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.6">
      <stop offset="0" stop-color="#2fd6ff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#2f6bff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fe6c8"/>
      <stop offset="0.5" stop-color="#3fd8ff"/>
      <stop offset="1" stop-color="#7c6bff"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3fd8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c7e6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#ff5e7a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- body -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- faint analyzer grid -->
    <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="2">
      <path d="M100 640H924M100 720H924M100 800H924"/>
      <path d="M237 560V924M374 560V924M511 560V924M648 560V924M785 560V924"/>
    </g>

    <!-- spectrum: noise floor with three clean carriers (coordinated mics) -->
    <path id="spec" fill="url(#fill)"
      d="M100 842 L150 836 L190 845 L230 832 L262 838 L280 826 L292 700 L304 826 L330 838 L380 830 L420 841
         L470 829 L500 836 L506 818 L512 610 L518 818 L524 836 L560 830 L600 842 L640 833 L676 839
         L718 826 L730 680 L742 826 L770 836 L820 829 L860 840 L900 832 L924 838 L924 924 L100 924 Z"/>
    <path fill="none" stroke="url(#trace)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" filter="url(#soft)" opacity="0.7"
      d="M100 842 L150 836 L190 845 L230 832 L262 838 L280 826 L292 700 L304 826 L330 838 L380 830 L420 841
         L470 829 L500 836 L506 818 L512 610 L518 818 L524 836 L560 830 L600 842 L640 833 L676 839
         L718 826 L730 680 L742 826 L770 836 L820 829 L860 840 L900 832 L924 838"/>
    <path fill="none" stroke="url(#trace)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"
      d="M100 842 L150 836 L190 845 L230 832 L262 838 L280 826 L292 700 L304 826 L330 838 L380 830 L420 841
         L470 829 L500 836 L506 818 L512 610 L518 818 L524 836 L560 830 L600 842 L640 833 L676 839
         L718 826 L730 680 L742 826 L770 836 L820 829 L860 840 L900 832 L924 838"/>
    <!-- carrier markers -->
    <g fill="#ffd166">
      <circle cx="292" cy="688" r="11"/>
      <circle cx="512" cy="596" r="13"/>
      <circle cx="730" cy="668" r="11"/>
    </g>
  </g>

  <!-- radio waves -->
  <g fill="none" stroke="url(#wave)" stroke-linecap="round">
    <path d="M378 240 A190 190 0 0 0 378 470" stroke-width="26" opacity="0.55"/>
    <path d="M646 240 A190 190 0 0 1 646 470" stroke-width="26" opacity="0.55"/>
    <path d="M420 280 A130 130 0 0 0 420 430" stroke-width="26" opacity="0.85"/>
    <path d="M604 280 A130 130 0 0 1 604 430" stroke-width="26" opacity="0.85"/>
  </g>

  <!-- handheld microphone -->
  <g>
    <rect x="452" y="206" width="120" height="176" rx="60" fill="url(#capsule)"/>
    <g stroke="#7f8fb5" stroke-width="7" stroke-linecap="round" opacity="0.8">
      <path d="M476 250H548M470 280H554M470 310H554M476 340H548"/>
    </g>
    <rect x="446" y="372" width="132" height="22" rx="11" fill="#2fd6ff"/>
    <path d="M466 394 H558 L540 548 Q512 566 484 548 Z" fill="#e8eefb"/>
    <path d="M466 394 H558 L554 430 H470 Z" fill="#c4d0ea"/>
  </g>
</svg>
  <text x="420" y="205" font-family="'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="800"
        font-size="150" letter-spacing="2" fill="#ffffff">UNIQUE <tspan fill="url(#word)">AV</tspan></text>
  <text x="426" y="290" font-family="'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600"
        font-size="58" letter-spacing="17" fill="#a9b6d3">RF SCAN CO-ORD</text>
</svg>
