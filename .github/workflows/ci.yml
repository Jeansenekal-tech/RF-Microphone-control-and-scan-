name: Build & test

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

defaults:
  run:
    shell: bash   # bash -eo pipefail, so a failing build fails the step even through tee

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build 2>&1 | tee build.log
      - name: Unit tests
        run: swift test 2>&1 | tee test.log
      - name: Build app bundle
        run: ./build_app.sh
      - name: Smoke test (launch app in demo mode, query web server, screenshots)
        run: |
          mkdir -p smoke
          open "build/Unique AV RF Scan Co-ord.app" --args --demo
          sleep 20
          KEY=$(defaults read app.wavedesk.WaveDesk remote.key)
          curl -s -o smoke/locked.html -w "locked page: %{http_code}\n" http://127.0.0.1:8088/
          curl -sf "http://127.0.0.1:8088/api/state?key=$KEY" -o smoke/state.json
          curl -sf "http://127.0.0.1:8088/api/spectrum?key=$KEY" -o smoke/spectrum.json
          curl -sf "http://127.0.0.1:8088/api/ch/1/name?key=$KEY"; echo
          curl -sf "http://127.0.0.1:8088/?key=$KEY" -o smoke/monitor.html
          head -c 1500 smoke/state.json; echo
          screencapture -x smoke/app.png
      - name: Licence gate test (licensed build without a key must stay locked)
        run: |
          osascript -e 'quit app "Unique AV RF Scan Co-ord"' || true
          sleep 3
          pkill -f "MacOS/WaveDesk" || true
          KEYGEN_ACCOUNT_ID=ci-test KEYGEN_PUBLIC_KEY=$(printf '0%.0s' {1..64}) ./build_app.sh
          grep -q 'keygenAccountID = ""' Sources/WaveDesk/BuildConfig.swift && echo "BuildConfig restored"
          open "build/Unique AV RF Scan Co-ord.app"
          sleep 12
          pgrep -f "MacOS/WaveDesk" >/dev/null || { echo "::error::App is not running (crashed?)"; exit 1; }
          echo "app running"
          if curl -s -m 3 -o /dev/null http://127.0.0.1:8088/; then
            echo "::error::Web server is running – the app was not locked"; exit 1
          fi
          echo "locked as expected (no web server, licence screen shown)"
          screencapture -x smoke/licence-gate.png || true
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: smoke/
