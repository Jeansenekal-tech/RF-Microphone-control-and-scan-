name: Release

# Two ways to publish a new version (the app's built-in updater picks up the newest release):
#   1. Bump CFBundleShortVersionString in Resources/Info.plist and push to main.
#      A release v<version> is created if it doesn't exist yet.
#   2. Push a tag:  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists – nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Will publish v$VERSION"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        if: steps.v.outputs.skip == 'false'
        run: swift test

      - name: Build universal app
        if: steps.v.outputs.skip == 'false'
        run: UNIVERSAL=1 VERSION="${{ steps.v.outputs.version }}" BUILD_NUMBER="${GITHUB_RUN_NUMBER}" ./build_app.sh

      - name: Zip
        if: steps.v.outputs.skip == 'false'
        run: |
          ditto -c -k --keepParent "build/Unique AV RF Scan Co-ord.app" "build/Unique-AV-RF-Scan-Co-ord.zip"
          # Legacy name so version 0.1.0 (which looks for "WaveDesk" in the file name) can still update.
          cp "build/Unique-AV-RF-Scan-Co-ord.zip" build/WaveDesk.zip

      - name: Publish release
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.v.outputs.version }}"
          gh release create "$V" build/Unique-AV-RF-Scan-Co-ord.zip build/WaveDesk.zip --target "$GITHUB_SHA" \
            --title "Unique AV RF Scan Co-ord ${{ steps.v.outputs.version }}" --generate-notes
