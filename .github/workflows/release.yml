name: Release

# Publish a new version:  git tag v0.2.0 && git push origin v0.2.0
# WaveDesk's built-in updater picks up the WaveDesk.zip attached to the newest release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Build universal app
        run: UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="${GITHUB_RUN_NUMBER}" ./build_app.sh
      - name: Zip
        run: ditto -c -k --keepParent build/WaveDesk.app build/WaveDesk.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/WaveDesk.zip \
            --title "WaveDesk ${GITHUB_REF_NAME#v}" --generate-notes
